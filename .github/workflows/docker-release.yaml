name: Docker Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  docker_build:
    name: Build and push image
    environment: docker_hub
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.get_version.outputs.TAG }}
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: get_version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.get_version.outputs.VERSION }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            dingdangdog/loden:${{ steps.get_version.outputs.VERSION }}
            dingdangdog/loden:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify NUXT_PUBLIC_VERSION in image
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          IMAGE_VERSION="$(docker run --rm --platform linux/amd64 --entrypoint printenv "dingdangdog/loden:$VERSION" NUXT_PUBLIC_VERSION)"
          if [[ "$IMAGE_VERSION" != "$VERSION" ]]; then
            echo "NUXT_PUBLIC_VERSION in image is '$IMAGE_VERSION', expected '$VERSION'"
            exit 1
          fi
          echo "NUXT_PUBLIC_VERSION=$IMAGE_VERSION"

  github_release:
    name: Publish GitHub Release
    needs: docker_build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.docker_build.outputs.tag }}
          name: ${{ needs.docker_build.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false

  sync_package_version:
    name: Sync package.json version
    needs: docker_build
    runs-on: ubuntu-latest
    # 默认分支开启保护、禁止 Actions 推送时，这里失败不影响已发布的镜像和 Release
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit package.json version
        env:
          VERSION: ${{ needs.docker_build.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CURRENT="$(jq -r '.version' package.json)"
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "package.json is already $VERSION"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n 1)"
          if [[ "$HIGHEST" != "$VERSION" ]]; then
            echo "::notice::$BRANCH already has package.json $CURRENT, newer than tag $VERSION. Skipped."
            exit 0
          fi
          npm pkg set version="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $VERSION"
          git push origin "HEAD:$BRANCH"
